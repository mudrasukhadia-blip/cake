<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Customer Reviews – Admin Panel</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <script>
        // SECURITY: Redirect if the admin is not logged in
        if (sessionStorage.getItem('isAdminLoggedIn') !== 'true') {
            window.location.href = 'admin-login.html';
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 260px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
        }

        .sidebar h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 40px;
            background: linear-gradient(135deg, #f472b6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-items {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .nav-item {
            padding: 12px 20px;
            border-radius: 12px;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(236, 72, 153, 0.15);
            color: #f472b6;
            transform: translateX(5px);
        }

        /* ── Main Content ── */
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 40px 50px;
            overflow-y: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 32px;
            font-weight: 600;
        }

        .admin-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(30, 41, 59, 0.7);
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .admin-profile img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
        }

        /* ── Reviews List ── */
        .section-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .reviews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .review-item {
            background: rgba(15, 23, 42, 0.6);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .reviewer-name {
            font-weight: 600;
            color: #e2e8f0;
            font-size: 18px;
        }

        .review-stars {
            color: #fbbf24;
            font-size: 16px;
        }

        .review-msg {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
            font-size: 18px;
            grid-column: 1 / -1;
        }

    </style>
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff69b4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    console.log('SW registered!', reg);
                }).catch(err => console.log('SW failed', err));
            });
        }
    </script>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>🍰 Admin Panel</h2>
        <div class="nav-items">
            <a href="admin.html" class="nav-item">📊 Dashboard</a>
            <a href="admin-orders.html" class="nav-item">📦 Orders</a>
            <a href="admin-reviews.html" class="nav-item active">⭐ Reviews</a>
            <a href="index.html" class="nav-item" style="margin-top: auto;">🌐 View Store</a>
            <a href="#" class="nav-item" onclick="logout()" style="color: #f87171;">🚪 Logout</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <header>
            <h1>Customer Reviews</h1>
            <div class="admin-profile">
                <img src="https://ui-avatars.com/api/?name=Admin&background=ec4899&color=fff" alt="Admin">
                <span>Super Admin</span>
            </div>
        </header>

        <div class="section-panel">
            <h2 style="font-size: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05);">All Ratings & Feedback</h2>
            
            <div class="reviews-grid" id="reviews-list-container">
                <!-- Dynamic Content -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadReviewsData();
            setInterval(loadReviewsData, 3000); // Polling for new reviews
        });

        function logout() {
            sessionStorage.removeItem('isAdminLoggedIn');
            window.location.href = 'admin-login.html';
        }

        async function loadReviewsData() {
            let allRatings = [];
            try {
                const response = await fetch('http://localhost:5000/api/reviews');
                if (response.ok) {
                    allRatings = await response.json();
                } else {
                    allRatings = JSON.parse(localStorage.getItem('allRatings')) || [];
                }
            } catch(e) {
                console.error("Backend not running, falling back to localStorage", e);
                allRatings = JSON.parse(localStorage.getItem('allRatings')) || [];
            }
            
            const reviewsContainer = document.getElementById('reviews-list-container');
            
            if (allRatings.length === 0) {
                reviewsContainer.innerHTML = '<div class="empty-state">No ratings received yet.</div>';
            } else {
                reviewsContainer.innerHTML = '';
                
                // Show newest first
                [...allRatings].reverse().forEach(review => {
                    const stars = '⭐'.repeat(review.rating);
                    
                    const div = document.createElement('div');
                    div.className = 'review-item';
                    div.innerHTML = `
                        <div>
                            <div class="review-header">
                                <span class="reviewer-name">${review.name}</span>
                                <span class="review-stars">${stars}</span>
                            </div>
                            <p class="review-msg">"${review.message}"</p>
                        </div>
                        <p style="font-size: 12px; color: #64748b; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px;">Submitted on: ${review.date}</p>
                    `;
                    reviewsContainer.appendChild(div);
                });
            }
        }
    </script>
</body>
</html>
