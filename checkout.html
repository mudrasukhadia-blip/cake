<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Secure Checkout – Sweet Cake Shop</title>
    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            background: linear-gradient(to right, #fff0f5, #ffe4e1);
            color:#333;
        }

        /* ── Header ── */
        header{
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding:18px 50px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            box-shadow:0 4px 15px rgba(0,0,0,0.08);
            border-bottom: 1px solid rgba(255, 105, 180, 0.2);
        }

        header h1{
            font-size:30px;
            font-weight:700;
            color: #8b4513;
        }

        nav {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        nav a{
            color: #555;
            text-decoration:none;
            font-size:17px;
            font-weight: 600;
            padding: 8px 20px;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        nav a:hover, nav a.active {
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            box-shadow: 0 4px 12px rgba(255, 105, 180, 0.3);
        }

        /* ── Checkout Container ── */
        .checkout-container {
            max-width: 1100px;
            margin: 60px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 40px;
        }

        .checkout-section {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .checkout-section h3 {
            font-size: 26px;
            color: #8b4513;
            margin-bottom: 25px;
            border-bottom: 2px solid #ffe4e1;
            padding-bottom: 10px;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-group {
            flex: 1;
            margin-bottom: 20px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .form-control:focus {
            outline: none;
            border-color: #ff69b4;
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 105, 180, 0.1);
        }

        /* ── Order Summary ── */
        .order-summary {
            background: linear-gradient(135deg, #fff0f5, #ffdde8);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            height: fit-content;
        }

        .order-summary h3 {
            font-size: 24px;
            color: #8b4513;
            margin-bottom: 25px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px dashed #ffb6c1;
        }

        .order-item img {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
        }

        .item-details {
            flex: 1;
            margin-left: 15px;
        }

        .item-details h4 {
            font-size: 16px;
            color: #333;
        }

        .item-price {
            font-weight: 600;
            color: #d2691e;
        }

        .totals {
            margin-top: 25px;
        }

        .totals-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 16px;
            color: #555;
        }

        .totals-row.grand-total {
            font-size: 20px;
            font-weight: 700;
            color: #8b4513;
            border-top: 2px solid #ffb6c1;
            padding-top: 15px;
            margin-top: 15px;
        }

        .checkout-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.4);
        }

        /* ── Footer ── */
        footer{
            background:#8b4513;
            color:white;
            text-align:center;
            padding:20px;
            margin-top: 60px;
        }

        @media(max-width: 900px){
            .checkout-container {
                grid-template-columns: 1fr;
            }
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>🍰 Sweet Cake Shop</h1>
        <nav>
            <a href="cakes.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- Checkout Content -->
    <div class="checkout-container">
        
        <!-- Billing Details -->
        <div class="checkout-section">
            <h3>Billing & Shipping Details</h3>
            
            <form id="checkout-form" onsubmit="event.preventDefault(); alert('Order Placed Successfully! Your delicious cake is on its way. 🎂'); window.location.href='cakes.html';">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" class="form-control" required placeholder="John">
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" class="form-control" required placeholder="Doe">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" class="form-control" required placeholder="john@example.com">
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" class="form-control" required placeholder="(555) 123-4567">
                    </div>
                </div>

                <div class="form-group">
                    <label>Street Address</label>
                    <input type="text" class="form-control" required placeholder="123 Sweet Street, Apt 4B">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" class="form-control" required placeholder="Sugar City">
                    </div>
                    <div class="form-group">
                        <label>Zip Code</label>
                        <input type="text" class="form-control" required placeholder="12345">
                    </div>
                </div>

                <h3 style="margin-top: 30px;">Payment Information</h3>

                <div class="form-group">
                    <label>Name on Card</label>
                    <input type="text" class="form-control" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label>Card Number</label>
                    <input type="text" class="form-control" required placeholder="XXXX-XXXX-XXXX-XXXX">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Expiry Date</label>
                        <input type="text" class="form-control" required placeholder="MM/YY">
                    </div>
                    <div class="form-group">
                        <label>CVV</label>
                        <input type="text" class="form-control" required placeholder="123">
                    </div>
                </div>

            </form>
        </div>

        <!-- Order Summary -->
        <div class="order-summary">
            <h3>Order Summary</h3>
            
            <div class="order-item">
                <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?q=80&w=200&auto=format&fit=crop" alt="Delicious Cake">
                <div class="item-details">
                    <h4>Signature Delicious Cake</h4>
                    <p style="font-size: 13px; color: #777;">1 lb</p>
                </div>
                <div class="item-price">$35.00</div>
            </div>

            <div class="totals">
                <div class="totals-row">
                    <span>Subtotal</span>
                    <span>$35.00</span>
                </div>
                <div class="totals-row">
                    <span>Shipping</span>
                    <span>$5.00</span>
                </div>
                <div class="totals-row">
                    <span>Taxes</span>
                    <span>$2.50</span>
                </div>
                <div class="totals-row grand-total">
                    <span>Total</span>
                    <span>$42.50</span>
                </div>
            </div>

            <button type="submit" form="checkout-form" class="checkout-btn">Place Order 🎂</button>
        </div>

    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 Sweet Cake Shop | Designed with ❤️</p>
    </footer>

</body>
</html>
